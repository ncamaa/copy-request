<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285f4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a73e8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="56" fill="url(#grad)" stroke="#1a73e8" stroke-width="2"/>
  
  <!-- Network/request icon -->
  <g transform="translate(32, 32)">
    <!-- Server/endpoint -->
    <rect x="8" y="8" width="48" height="8" rx="4" fill="white" opacity="0.9"/>
    <rect x="8" y="20" width="48" height="8" rx="4" fill="white" opacity="0.7"/>
    <rect x="8" y="32" width="48" height="8" rx="4" fill="white" opacity="0.9"/>
    
    <!-- Arrow indicating request/response -->
    <path d="M16 50 L32 58 L16 66 Z" fill="white" opacity="0.8"/>
    <rect x="32" y="56" width="16" height="4" fill="white" opacity="0.8"/>
    
    <!-- Copy/clipboard element -->
    <rect x="40" y="44" width="20" height="24" rx="2" fill="none" stroke="white" stroke-width="2" opacity="0.9"/>
    <rect x="42" y="46" width="16" height="2" fill="white" opacity="0.7"/>
    <rect x="42" y="50" width="16" height="2" fill="white" opacity="0.7"/>
    <rect x="42" y="54" width="12" height="2" fill="white" opacity="0.7"/>
  </g>
</svg>

